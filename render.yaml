  # ─── ML Service (Python FastAPI) ───
  - type: web
    name: urjasetu-ml-service
    runtime: python
    plan: free
    buildCommand: cd ml-service && pip install -r requirements.txt
    startCommand: cd ml-service && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
