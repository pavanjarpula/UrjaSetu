  # ─── Backend (Node.js Express) ───
  - type: web
    name: urjasetu-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: MONGO_URI
        value: "mongodb+srv://mepavaniitkgp_db_user:OkeDvLvXNdK2Xr2y@urjasetu.2f5foqc.mongodb.net/urjasetu_database?retryWrites=true&w=majority&appName=urjasetu"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_API_KEY
